name: Build release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and package version must match' }
      - run: npm test
      - run: npm run privacy:check
      - run: npm run runtime:fetch
      - run: npm run notices
      - run: npm run dist
      - run: npm run release:check
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release-update/ServerLoom-*.exe
            release-update/ServerLoom-*.exe.blockmap
            release-update/ServerLoom-*.zip
            release-update/alpha.yml
            release-update/beta.yml
            release-update/latest.yml
            release-update/SHA256SUMS.txt
  draft:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release
      - name: Create draft with complete assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --draft --title "ServerLoom $GITHUB_REF_NAME" --notes "See the bundled release notes and project documentation. Review assets before publishing." "${flags[@]}"
